<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Formatter</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        serif: ['Playfair Display', 'serif'],
                        dm: ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; padding: 0; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass {
            background: rgba(17, 24, 39, 0.7);
        }
        .format-preview {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .btn-press:active { transform: scale(0.97); }
    </style>
<base target="_blank">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ─── FORMAT TEMPLATES ───
        const FORMATS = {
            classic: {
                name: "Classic Box",
                description: "Clean bordered format with icons",
                render: (type, date, entries, theme) => {
                    const isDark = theme === 'dark';
                    const icon = type === 'plan' ? '📅' : '📌';
                    const title = type === 'plan' ? 'Work Plan' : 'Work Update';
                    const borderColor = isDark ? '#374151' : '#e5e7eb';
                    const textColor = isDark ? '#f3f4f6' : '#1f2937';
                    const subColor = isDark ? '#9ca3af' : '#6b7280';

                    let output = `${icon} || ${title} – ${date} ||\n`;
                    output += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;

                    entries.forEach(entry => {
                        if (entry.name.trim()) {
                            output += ` 🔹 ${entry.name}\n`;
                            const items = entry.tasks.split('\n').filter(t => t.trim());
                            if (items.length === 0) {
                                output += `   • Not Found\n`;
                            } else {
                                items.forEach(task => {
                                    output += `   • ${task.trim()}\n`;
                                });
                            }
                        }
                    });

                    output += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;
                    return output;
                }
            },
            minimal: {
                name: "Minimal Clean",
                description: "Simple and modern minimal style",
                render: (type, date, entries, theme) => {
                    const isDark = theme === 'dark';
                    const title = type === 'plan' ? 'WORK PLAN' : 'WORK UPDATE';

                    let output = `╭────────────────────────────────────────╮\n`;
                    output += `│  ${title}\n`;
                    output += `│  ${date}\n`;
                    output += `╰────────────────────────────────────────╯\n\n`;

                    entries.forEach((entry, idx) => {
                        if (entry.name.trim()) {
                            output += `▸ ${entry.name.toUpperCase()}\n`;
                            output += `  ${'─'.repeat(30)}\n`;
                            const items = entry.tasks.split('\n').filter(t => t.trim());
                            if (items.length === 0) {
                                output += `  ○ No tasks recorded\n`;
                            } else {
                                items.forEach(task => {
                                    output += `  ○ ${task.trim()}\n`;
                                });
                            }
                            if (idx < entries.length - 1) output += `\n`;
                        }
                    });

                    return output;
                }
            },
            modern: {
                name: "Modern Card",
                description: "Card-based layout with emojis",
                render: (type, date, entries, theme) => {
                    const isDark = theme === 'dark';
                    const icon = type === 'plan' ? '🎯' : '✅';
                    const title = type === 'plan' ? 'Daily Work Plan' : 'Work Update';

                    let output = `┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓\n`;
                    output += `┃  ${icon}  ${title}\n`;
                    output += `┃  📆 ${date}\n`;
                    output += `┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛\n\n`;

                    entries.forEach((entry, idx) => {
                        if (entry.name.trim()) {
                            output += `┌─ ${entry.name} ─${'─'.repeat(Math.max(0, 28 - entry.name.length))}┐\n`;
                            const items = entry.tasks.split('\n').filter(t => t.trim());
                            if (items.length === 0) {
                                output += `│  ⚪ No entries\n`;
                            } else {
                                items.forEach(task => {
                                    const bullet = type === 'plan' ? '🔹' : '✓';
                                    output += `│  ${bullet} ${task.trim()}\n`;
                                });
                            }
                            output += `└${'─'.repeat(38)}┘`;
                            if (idx < entries.length - 1) output += `\n\n`;
                        }
                    });

                    return output;
                }
            },
            corporate: {
                name: "Corporate Pro",
                description: "Professional business format",
                render: (type, date, entries, theme) => {
                    const title = type === 'plan' ? 'WORK PLAN' : 'WORK UPDATE REPORT';
                    const subtitle = type === 'plan' ? 'Scheduled Tasks' : 'Completed Tasks';

                    let output = `═══════════════════════════════════════════════════\n`;
                    output += `           ${title}\n`;
                    output += `           Date: ${date}\n`;
                    output += `═══════════════════════════════════════════════════\n\n`;

                    entries.forEach((entry, idx) => {
                        if (entry.name.trim()) {
                            output += `[ ${entry.name} ]\n`;
                            output += `${'─'.repeat(40)}\n`;
                            const items = entry.tasks.split('\n').filter(t => t.trim());
                            if (items.length === 0) {
                                output += `    N/A\n`;
                            } else {
                                items.forEach((task, i) => {
                                    output += `    ${i + 1}. ${task.trim()}\n`;
                                });
                            }
                            if (idx < entries.length - 1) output += `\n`;
                        }
                    });

                    output += `\n═══════════════════════════════════════════════════`;
                    return output;
                }
            }
        };

        // ─── MAIN APP ───
// ─── MAIN APP ───
function App() {
    const [themeMode, setThemeMode] = useState('auto'); // 'auto' | 'light' | 'dark'
    const [darkMode, setDarkMode] = useState(false);

    const [font, setFont] = useState('font-sans');
    const [format, setFormat] = useState('classic');
    const [activeTab, setActiveTab] = useState('editor');
    const [type, setType] = useState('plan');
    const [entries, setEntries] = useState([
        { id: 1, name: 'Mahamudul Hasan', tasks: 'Customer Support (ReviewX, ReviewXpo, Crowdfundly)\nRoutine check (All emails, Crisp chats and help scout tickets)\nTroubleshoot on ReviewX customer site\nWill start new QA session.\nCollab with Arafat bhai for license key delete issue.' },
        { id: 2, name: 'Sagor Ahmed', tasks: '' }
    ]);
    const [copied, setCopied] = useState(false);
    const [currentDate, setCurrentDate] = useState('');
    const outputRef = useRef(null);

    // Set date
    useEffect(() => {
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: '2-digit' };
        setCurrentDate(now.toLocaleDateString('en-US', options));
    }, []);

    // Theme handling (AUTO + SYSTEM SYNC)
    useEffect(() => {
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

        const applyTheme = () => {
            if (themeMode === 'auto') {
                setDarkMode(mediaQuery.matches);
            } else {
                setDarkMode(themeMode === 'dark');
            }
        };

        applyTheme();

        mediaQuery.addEventListener('change', applyTheme);
        return () => mediaQuery.removeEventListener('change', applyTheme);
    }, [themeMode]);

    // Apply Tailwind dark class
    useEffect(() => {
        if (darkMode) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    }, [darkMode]);

            const addEntry = () => {
                const newId = Math.max(...entries.map(e => e.id), 0) + 1;
                setEntries([...entries, { id: newId, name: '', tasks: '' }]);
            };

            const removeEntry = (id) => {
                if (entries.length > 1) {
                    setEntries(entries.filter(e => e.id !== id));
                }
            };

            const updateEntry = (id, field, value) => {
                setEntries(entries.map(e => e.id === id ? { ...e, [field]: value } : e));
            };

            const generatedOutput = FORMATS[format].render(type, currentDate, entries, darkMode ? 'dark' : 'light');

            const copyToClipboard = async () => {
                try {
                    await navigator.clipboard.writeText(generatedOutput);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    // Fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = generatedOutput;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            const fontOptions = [
                { value: 'font-sans', label: 'Inter (Modern)', family: 'Inter' },
                { value: 'font-mono', label: 'JetBrains Mono (Code)', family: 'JetBrains Mono' },
                { value: 'font-serif', label: 'Playfair (Elegant)', family: 'Playfair Display' },
                { value: 'font-dm', label: 'DM Sans (Clean)', family: 'DM Sans' },
            ];

            return (
                <div className={`min-h-screen transition-colors duration-300 ${darkMode ? 'bg-gray-900 text-gray-100' : 'bg-gray-50 text-gray-900'} ${font}`}>

                    {/* Header */}
                    <header className={`sticky top-0 z-50 glass border-b ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
                        <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl ${darkMode ? 'bg-indigo-600' : 'bg-indigo-500'} text-white shadow-lg`}>
                                    📝
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight">Work Formatter</h1>
                                    <p className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>{currentDate}</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setActiveTab('editor')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all btn-press ${
                                        activeTab === 'editor' 
                                            ? (darkMode ? 'bg-indigo-600 text-white' : 'bg-indigo-500 text-white') 
                                            : (darkMode ? 'text-gray-400 hover:bg-gray-800' : 'text-gray-600 hover:bg-gray-100')
                                    }`}
                                >
                                    ✏️ Editor
                                </button>
                                <button
                                    onClick={() => setActiveTab('settings')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all btn-press ${
                                        activeTab === 'settings' 
                                            ? (darkMode ? 'bg-indigo-600 text-white' : 'bg-indigo-500 text-white') 
                                            : (darkMode ? 'text-gray-400 hover:bg-gray-800' : 'text-gray-600 hover:bg-gray-100')
                                    }`}
                                >
                                    ⚙️ Settings
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-6">
                        {activeTab === 'editor' ? (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-fade-in">

                                {/* INPUT SECTION */}
                                <div className={`rounded-2xl border ${darkMode ? 'bg-gray-800/50 border-gray-700' : 'bg-white border-gray-200'} shadow-sm overflow-hidden`}>
                                    <div className={`px-6 py-4 border-b ${darkMode ? 'border-gray-700' : 'border-gray-100'} flex items-center justify-between`}>
                                        <h2 className="font-semibold text-lg">Input</h2>
                                        <div className="flex items-center gap-2">
                                            <span className={`text-xs font-medium px-2 py-1 rounded-md ${darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-600'}`}>
                                                {entries.length} member{entries.length !== 1 ? 's' : ''}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="p-6 space-y-6">
                                        {/* Type Selector */}
                                        <div>
                                            <label className={`block text-sm font-medium mb-2 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Document Type</label>
                                            <div className="grid grid-cols-2 gap-2 p-1 rounded-xl bg-gray-100 dark:bg-gray-700">
                                                <button
                                                    onClick={() => setType('plan')}
                                                    className={`py-2.5 px-4 rounded-lg text-sm font-medium transition-all btn-press ${
                                                        type === 'plan' 
                                                            ? 'bg-white dark:bg-gray-600 shadow-sm text-indigo-600 dark:text-indigo-400' 
                                                            : 'text-gray-500 dark:text-gray-400 hover:text-gray-700'
                                                    }`}
                                                >
                                                    📅 Work Plan
                                                </button>
                                                <button
                                                    onClick={() => setType('update')}
                                                    className={`py-2.5 px-4 rounded-lg text-sm font-medium transition-all btn-press ${
                                                        type === 'update' 
                                                            ? 'bg-white dark:bg-gray-600 shadow-sm text-indigo-600 dark:text-indigo-400' 
                                                            : 'text-gray-500 dark:text-gray-400 hover:text-gray-700'
                                                    }`}
                                                >
                                                    📌 Work Update
                                                </button>
                                            </div>
                                        </div>

                                        {/* Entries */}
                                        <div className="space-y-4 max-h-[500px] overflow-y-auto scrollbar-hide pr-1">
                                            {entries.map((entry, index) => (
                                                <div key={entry.id} className={`rounded-xl border ${darkMode ? 'border-gray-700 bg-gray-700/30' : 'border-gray-200 bg-gray-50'} p-4 space-y-3`}>
                                                    <div className="flex items-center gap-2">
                                                        <span className={`text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center ${darkMode ? 'bg-indigo-900 text-indigo-300' : 'bg-indigo-100 text-indigo-600'}`}>
                                                            {index + 1}
                                                        </span>
                                                        <input
                                                            type="text"
                                                            placeholder="Member name..."
                                                            value={entry.name}
                                                            onChange={(e) => updateEntry(entry.id, 'name', e.target.value)}
                                                            className={`flex-1 bg-transparent border-b-2 ${darkMode ? 'border-gray-600 focus:border-indigo-500' : 'border-gray-300 focus:border-indigo-500'} px-1 py-1 text-sm font-medium outline-none transition-colors placeholder-gray-400`}
                                                        />
                                                        {entries.length > 1 && (
                                                            <button
                                                                onClick={() => removeEntry(entry.id)}
                                                                className={`p-1.5 rounded-lg transition-colors ${darkMode ? 'hover:bg-red-900/30 text-gray-400 hover:text-red-400' : 'hover:bg-red-50 text-gray-400 hover:text-red-500'}`}
                                                            >
                                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                                            </button>
                                                        )}
                                                    </div>
                                                    <textarea
                                                        placeholder={`Enter tasks (one per line)...\nExample:\n• Customer Support\n• Routine check\n• Troubleshoot issues`}
                                                        value={entry.tasks}
                                                        onChange={(e) => updateEntry(entry.id, 'tasks', e.target.value)}
                                                        rows={5}
                                                        className={`w-full rounded-lg border ${darkMode ? 'border-gray-600 bg-gray-800 text-gray-200 placeholder-gray-500' : 'border-gray-300 bg-white text-gray-800 placeholder-gray-400'} px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500/50 resize-none transition-all`}
                                                    />
                                                </div>
                                            ))}
                                        </div>

                                        <button
                                            onClick={addEntry}
                                            className={`w-full py-3 rounded-xl border-2 border-dashed ${darkMode ? 'border-gray-600 text-gray-400 hover:border-indigo-500 hover:text-indigo-400' : 'border-gray-300 text-gray-500 hover:border-indigo-500 hover:text-indigo-600'} font-medium text-sm transition-all btn-press flex items-center justify-center gap-2`}
                                        >
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                                            Add Member
                                        </button>
                                    </div>
                                </div>

                                {/* OUTPUT SECTION */}
                                <div className={`rounded-2xl border ${darkMode ? 'bg-gray-800/50 border-gray-700' : 'bg-white border-gray-200'} shadow-sm overflow-hidden flex flex-col`}>
                                    <div className={`px-6 py-4 border-b ${darkMode ? 'border-gray-700' : 'border-gray-100'} flex items-center justify-between`}>
                                        <h2 className="font-semibold text-lg">Preview</h2>
                                        <div className="flex items-center gap-2">
                                            <span className={`text-xs px-2 py-1 rounded-md ${darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-600'}`}>
                                                {FORMATS[format].name}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="flex-1 p-6 flex flex-col">
                                        <div className={`flex-1 rounded-xl border ${darkMode ? 'border-gray-700 bg-gray-900' : 'border-gray-200 bg-gray-50'} p-5 overflow-auto`}>
                                            <pre 
                                                ref={outputRef}
                                                className={`format-preview text-sm leading-relaxed ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}
                                                style={{ fontFamily: 'inherit' }}
                                            >
                                                {generatedOutput}
                                            </pre>
                                        </div>

                                        <div className="mt-4 flex gap-2">
                                            <button
                                                onClick={copyToClipboard}
                                                className={`flex-1 py-3 rounded-xl font-medium text-sm transition-all btn-press flex items-center justify-center gap-2 ${
                                                    copied 
                                                        ? 'bg-green-500 text-white' 
                                                        : (darkMode ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-indigo-500 hover:bg-indigo-600 text-white')
                                                }`}
                                            >
                                                {copied ? (
                                                    <>
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
                                                        Copied!
                                                    </>
                                                ) : (
                                                    <>
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                                                        Copy to Clipboard
                                                    </>
                                                )}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* SETTINGS PAGE */
                            <div className="max-w-2xl mx-auto animate-fade-in">
                                <div className={`rounded-2xl border ${darkMode ? 'bg-gray-800/50 border-gray-700' : 'bg-white border-gray-200'} shadow-sm overflow-hidden`}>
                                    <div className={`px-6 py-4 border-b ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                                        <h2 className="font-semibold text-lg">Appearance Settings</h2>
                                        <p className={`text-sm mt-1 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Customize how your work formatter looks</p>
                                    </div>

                                    <div className="p-6 space-y-8">
                                        {/* Theme */}
                                        <div>
                                            <label className={`block text-sm font-medium mb-3 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Theme</label>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button
                                                    onClick={() => setDarkMode(false)}
                                                    className={`p-4 rounded-xl border-2 transition-all btn-press flex items-center gap-3 ${
                                                        !darkMode 
                                                            ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' 
                                                            : (darkMode ? 'border-gray-700 hover:border-gray-600' : 'border-gray-200 hover:border-gray-300')
                                                    }`}
                                                >
                                                    <div className="w-10 h-10 rounded-lg bg-white border border-gray-200 shadow-sm flex items-center justify-center text-lg">☀️</div>
                                                    <div className="text-left">
                                                        <div className="font-medium text-sm">Light Mode</div>
                                                        <div className={`text-xs ${darkMode ? 'text-gray-500' : 'text-gray-500'}`}>Clean and bright</div>
                                                    </div>
                                                </button>
                                                <button
                                                    onClick={() => setDarkMode(true)}
                                                    className={`p-4 rounded-xl border-2 transition-all btn-press flex items-center gap-3 ${
                                                        darkMode 
                                                            ? 'border-indigo-500 bg-indigo-900/20' 
                                                            : (darkMode ? 'border-gray-700 hover:border-gray-600' : 'border-gray-200 hover:border-gray-300')
                                                    }`}
                                                >
                                                    <div className="w-10 h-10 rounded-lg bg-gray-800 border border-gray-700 shadow-sm flex items-center justify-center text-lg">🌙</div>
                                                    <div className="text-left">
                                                        <div className="font-medium text-sm">Dark Mode</div>
                                                        <div className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Easy on the eyes</div>
                                                    </div>
                                                </button>
                                            </div>
                                        </div>

                                        {/* Font */}
                                        <div>
                                            <label className={`block text-sm font-medium mb-3 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Font Family</label>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {fontOptions.map((opt) => (
                                                    <button
                                                        key={opt.value}
                                                        onClick={() => setFont(opt.value)}
                                                        className={`p-4 rounded-xl border-2 transition-all btn-press text-left ${
                                                            font === opt.value 
                                                                ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' 
                                                                : (darkMode ? 'border-gray-700 hover:border-gray-600' : 'border-gray-200 hover:border-gray-300')
                                                        }`}
                                                    >
                                                        <div className="font-medium text-sm" style={{ fontFamily: opt.family }}>{opt.label}</div>
                                                        <div className={`text-xs mt-1 ${darkMode ? 'text-gray-500' : 'text-gray-500'}`} style={{ fontFamily: opt.family }}>The quick brown fox</div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Format */}
                                        <div>
                                            <label className={`block text-sm font-medium mb-3 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Default Format Style</label>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {Object.entries(FORMATS).map(([key, fmt]) => (
                                                    <button
                                                        key={key}
                                                        onClick={() => setFormat(key)}
                                                        className={`p-4 rounded-xl border-2 transition-all btn-press text-left ${
                                                            format === key 
                                                                ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' 
                                                                : (darkMode ? 'border-gray-700 hover:border-gray-600' : 'border-gray-200 hover:border-gray-300')
                                                        }`}
                                                    >
                                                        <div className="font-medium text-sm">{fmt.name}</div>
                                                        <div className={`text-xs mt-1 ${darkMode ? 'text-gray-500' : 'text-gray-500'}`}>{fmt.description}</div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
